        let db = {};

        function loadDB() {
            const raw = localStorage.getItem(DB_KEY);
            if (!raw) {
                db = JSON.parse(JSON.stringify(defaultDB));
                saveDB();
            } else {
                try {
                    db = JSON.parse(raw);
                } catch(e) {
                    db = JSON.parse(JSON.stringify(defaultDB));
                    saveDB();
                }
            }
            const sessionUser = localStorage.getItem('GPS_CURRENT_USER');
            if (sessionUser) {
                try {
                    currentUser = JSON.parse(sessionUser);
                } catch(e) {
                    currentUser = null;
                }
            }
        }

        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            if (currentUser) {
                // refresh current user object from db in case roles changed
                const found = db.users.find(u => u.id === currentUser.id);
                if (found) {
                    currentUser = found;
                    localStorage.setItem('GPS_CURRENT_USER', JSON.stringify(currentUser));
                }
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const user = db.users.find(u => u.email === email && u.password === pass);
            if (!user) {
                const err = document.getElementById('loginError');
                err.textContent = 'Invalid email or password.';
                err.classList.remove('hidden');
                return;
            }
            currentUser = user;
            localStorage.setItem('GPS_CURRENT_USER', JSON.stringify(currentUser));
            closeModal();
            currentTab = 'overview';
            renderAll();
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const subject = document.getElementById('signupSubject').value.trim() || 'General';
            const phone = document.getElementById('signupPhone').value.trim() || '+92 300 0000000';
            const pass = document.getElementById('signupPass').value.trim();

            if (db.users.some(u => u.email === email)) {
                const err = document.getElementById('signupError');
                err.textContent = 'Email already exists. Please login.';
                err.classList.remove('hidden');
                return;
            }

            const newUser = {
                id: 'usr_' + Date.now(),
                name,
                email,
                password: pass,
                role: 'New User',
                subject,
                phone,
                status: 'Active'
            };
            db.users.push(newUser);
            saveDB();
            currentUser = newUser;
            localStorage.setItem('GPS_CURRENT_USER', JSON.stringify(currentUser));
            closeModal();
            currentTab = 'overview';
            renderAll();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('GPS_CURRENT_USER');
            currentTab = 'overview';
            renderAll();
        }

        function drawAttendanceChart() {
            const canvas = document.getElementById('attendanceCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth || 500;
            canvas.height = 200;

            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const data = [92, 95, 88, 94, 90, 70, 0]; // Sample attendance percentages

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = 35;
            const gap = (canvas.width - 80 - (days.length * barWidth)) / (days.length - 1);
            let startX = 40;

            days.forEach((day, i) => {
                const val = data[i];
                const barHeight = (val / 100) * 120;
                const y = 160 - barHeight;

                // Draw Bar
                ctx.fillStyle = '#2563eb';
                ctx.beginPath();
                ctx.roundRect(startX, y, barWidth, barHeight, [6, 6, 0, 0]);
                ctx.fill();

                // Draw Label
                ctx.fillStyle = '#64748b';
                ctx.font = '11px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(day, startX + (barWidth / 2), 180);

                // Draw Value
                if (val > 0) {
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 10px Inter';
                    ctx.fillText(val + '%', startX + (barWidth / 2), y - 6);
                }

                startX += barWidth + gap;
            });
        }

        function handleSaveStudent(e) {
            e.preventDefault();
            const newStd = {
                id: 'std_' + Date.now(),
                roll: document.getElementById('stdRoll').value.trim(),
                name: document.getElementById('stdName').value.trim(),
                father: document.getElementById('stdFather').value.trim(),
                class: document.getElementById('stdClass').value,
                phone: document.getElementById('stdPhone').value.trim() || '+92 300 0000000',
                feesStatus: document.getElementById('stdFees').value,
                address: document.getElementById('stdAddress').value.trim() || 'Dhok Jhatt'
            };
            db.students.push(newStd);
            saveDB();
            closeModal();
            renderAll();
        }

                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Father Name *</label>
                        <input type="text" id="editStdFather" value="${s.father}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">

        function handleUpdateStudent(e, id) {
            e.preventDefault();
            const s = db.students.find(x => x.id === id);
            if (!s) return;
            s.roll = document.getElementById('editStdRoll').value.trim();
            s.name = document.getElementById('editStdName').value.trim();
            s.father = document.getElementById('editStdFather').value.trim();
            s.class = document.getElementById('editStdClass').value;
            s.phone = document.getElementById('editStdPhone').value.trim();
            s.feesStatus = document.getElementById('editStdFees').value;
            s.address = document.getElementById('editStdAddress').value.trim();
            saveDB();
            closeModal();
            renderAll();
        }

        function viewStudentProfile(id) {
            const s = db.students.find(x => x.id === id);
            if (!s) return;
            openModal(`
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-blue-600 text-white rounded-3xl mx-auto flex items-center justify-center text-3xl font-bold shadow-lg mb-3">

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                db.students = db.students.filter(x => x.id !== id);
                saveDB();
                renderAll();
            }
        }

        function exportStudentsCSV() {
            let csv = 'Roll,Name,Father,Class,Phone,FeesStatus,Address\n';
            db.students.forEach(s => {
                csv += `"${s.roll}","${s.name}","${s.father}","${s.class}","${s.phone}","${s.feesStatus}","${s.address}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'GPS_Dhok_Jhatt_Students.csv');
            a.click();
        }

        // --- 5. ATTENDANCE TAB ---
        function renderAttendanceTab() {
            const today = window.currentAttendanceDate || new Date().toISOString().split('T')[0];
            if (!db.attendance[today]) {
                db.attendance[today] = {};
                db.students.forEach(s => db.attendance[today][s.id] = 'Present');
                saveDB();
            }
            const dayAtt = db.attendance[today];
            const total = db.students.length;
            let presentCount = 0, absentCount = 0, lateCount = 0;
            db.students.forEach(s => {
                const st = dayAtt[s.id];
                if (st === 'Present') presentCount++;
                else if (st === 'Absent') absentCount++;
                else if (st === 'Late') lateCount++;
            });
            const rate = total > 0 ? Math.round((presentCount / total) * 100) : 0;

            return `
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

                        <p class="text-xs text-slate-500">Record and monitor daily student attendance.</p>
                    </div>
                    <div class="flex flex-wrap gap-2 items-center">
                        <input type="date" value="${today}" onchange="window.currentAttendanceDate=this.value; renderAll();" class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">
                        <button onclick="markAllAttendance('Present')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow transition">Mark All Present</button>
                        <button onclick="exportAttendanceCSV()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-download"></i> CSV</button>
                    </div>
                </div>

                <!-- 4 Stat Boxes -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center">
                        <div class="text-2xl font-bold text-emerald-700">${presentCount}</div>
                        <div class="text-xs text-emerald-600 font-semibold mt-1">Present</div>
                    </div>
                    <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-center">
                        <div class="text-2xl font-bold text-rose-700">${absentCount}</div>
                        <div class="text-xs text-rose-600 font-semibold mt-1">Absent</div>
                    </div>
                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center">
                        <div class="text-2xl font-bold text-amber-700">${lateCount}</div>
                        <div class="text-xs text-amber-600 font-semibold mt-1">Late</div>
                    </div>
                    <div class="bg-blue-50 border border-blue-200 rounded-2xl p-4 text-center">
                        <div class="text-2xl font-bold text-blue-700">${rate}%</div>
                        <div class="text-xs text-blue-600 font-semibold mt-1">Attendance Rate</div>
                    </div>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-600 uppercase text-[10px] tracking-wider border-b border-slate-200">
                            <tr>
                                <th class="p-3.5">Roll No</th>
                                <th class="p-3.5">Student Name</th>
                                <th class="p-3.5">Class</th>
                                <th class="p-3.5">Status</th>
                                <th class="p-3.5 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-xs">
                            ${db.students.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400 italic">No records yet</td></tr>` : db.students.map(s => {
                                const st = dayAtt[s.id] || 'Present';
                                return `
                                <tr class="hover:bg-slate-50/80 transition">
                                    <td class="p-3.5 font-bold text-slate-700">${s.roll}</td>
                                    <td class="p-3.5 font-bold text-slate-900">${s.name}</td>
                                    <td class="p-3.5"><span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 font-semibold text-[10px]">Class ${s.class}</span></td>
                                    <td class="p-3.5">
                                        <span class="px-2.5 py-1 rounded-full font-semibold text-[10px] ${st==='Present'?'bg-emerald-100 text-emerald-700':st==='Absent'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700'}">
                                            ${st}
                                        </span>
                                    </td>
                                    <td class="p-3.5 text-right space-x-1">
                                        <button onclick="setAttendance('${s.id}', 'Present')" class="px-3 py-1.5 rounded-lg font-semibold ${st==='Present'?'bg-emerald-600 text-white':'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'} transition">Present</button>
                                        <button onclick="setAttendance('${s.id}', 'Absent')" class="px-3 py-1.5 rounded-lg font-semibold ${st==='Absent'?'bg-rose-600 text-white':'bg-rose-50 text-rose-600 hover:bg-rose-100'} transition">Absent</button>
                                        <button onclick="setAttendance('${s.id}', 'Late')" class="px-3 py-1.5 rounded-lg font-semibold ${st==='Late'?'bg-amber-600 text-white':'bg-amber-50 text-amber-600 hover:bg-amber-100'} transition">Late</button>
                                    </td>
                                </tr>`;

        function exportAttendanceCSV() {
            const today = window.currentAttendanceDate || new Date().toISOString().split('T')[0];
            const dayAtt = db.attendance[today] || {};
            let csv = `Roll,Name,Class,Status,Date\n`;
            db.students.forEach(s => {
                csv += `"${s.roll}","${s.name}","${s.class}","${dayAtt[s.id] || 'Present'}","${today}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `GPS_Attendance_${today}.csv`);
            a.click();
        }

            let score = 0;

            q.attempts.push({ name: currentUser.name, score: `${score}/${q.questions.length}` });

        function handleSaveResult(e) {
            e.preventDefault();
            const sel = document.getElementById('resStudent');
            const studentId = sel.value;
            const studentName = sel.options[sel.selectedIndex].text.split(' (')[0];
            const cls = sel.options[sel.selectedIndex].getAttribute('data-class') || '5';
            const marks = parseFloat(document.getElementById('resMarks').value);
            
            let grade = 'F';
            if (marks >= 90) grade = 'A+';
            else if (marks >= 80) grade = 'A';
            else if (marks >= 70) grade = 'B';
            else if (marks >= 60) grade = 'C';
            else if (marks >= 50) grade = 'D';

                studentId,
                studentName,
                subject: document.getElementById('resSubject').value.trim(),
                marks,
                total: 100,
                class: cls,
                grade
            });
            saveDB();
            closeModal();
            renderAll();

                                    <td class="p-3.5 font-bold text-slate-900">${u.name}</td>

                                    <td class="p-3.5 text-slate-600">${u.subject || '-'}</td>
                                    <td class="p-3.5">
                                        <span class="px-2.5 py-1 rounded-full font-semibold text-[10px] ${u.role==='Admin'?'bg-purple-100 text-purple-700':u.role==='Head Teacher'?'bg-blue-100 text-blue-700':u.role==='Teacher'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">
                                            ${u.role}
                                        </span>
                                    </td>
                                    <td class="p-3.5 text-right space-x-2">
                                        ${u.email !== 'harisawan.pk.@school.tm' ? `
                                            <select onchange="changeUserRole('${u.id}', this.value)" class="px-2 py-1 bg-slate-100 border border-slate-200 rounded-lg text-xs font-semibold">
                                                <option value="New User" ${u.role==='New User'?'selected':''}>New User</option>
                                                <option value="Teacher" ${u.role==='Teacher'?'selected':''}>Teacher</option>
                                                <option value="Head Teacher" ${u.role==='Head Teacher'?'selected':''}>Head Teacher</option>
                                                <option value="Parent" ${u.role==='Parent'?'selected':''}>Parent</option>
                                                <option value="Student" ${u.role==='Student'?'selected':''}>Student</option>
                                            </select>
                                            <button onclick="resetUserPassword('${u.id}')" class="px-2.5 py-1.5 bg-slate-200 text-slate-700 rounded-lg" title="Reset Pass"><i class="fa-solid fa-key"></i></button>
                                            <button onclick="deleteUser('${u.id}')" class="px-2.5 py-1.5 bg-rose-50 text-rose-600 rounded-lg" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                        ` : '<span class="text-[10px] text-purple-600 font-bold">Primary Admin</span>'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        function openAddStaffModal() {
            openModal(`
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-user-plus text-blue-600"></i> Add Staff Manually</h3>
                <form onsubmit="handleSaveStaff(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name *</label>
                        <input type="text" id="stfName" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Full Name">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email Address *</label>
                        <input type="email" id="stfEmail" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="email@school.tm">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Subject / Designation *</label>
                            <input type="text" id="stfSubject" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Science Teacher">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Role *</label>
                            <select id="stfRole" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                <option value="Teacher">Teacher</option>
                                <option value="Head Teacher">Head Teacher</option>
                                <option value="Parent">Parent</option>
                                <option value="Student">Student</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password *</label>
                        <input type="password" id="stfPass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-full shadow transition">
                        Save Staff Account
                    </button>
                </form>
            `);
        }

        function handleSaveStaff(e) {
            e.preventDefault();
            const email = document.getElementById('stfEmail').value.trim();
            if (email === 'harisawan.pk.@school.tm') {
                alert('Only Haris Awan can be Admin.');
                return;
            }
            db.users.push({
                id: 'usr_' + Date.now(),
                name: document.getElementById('stfName').value.trim(),
                email,
                subject: document.getElementById('stfSubject').value.trim(),
                role: document.getElementById('stfRole').value,
                password: document.getElementById('stfPass').value.trim(),
                status: 'Active'
            });
            saveDB();
            closeModal();
            renderAll();
        }

        function changeUserRole(userId, newRole) {
            if (newRole === 'Admin') {
                alert('Only Haris Awan can be Admin.');
                renderAll();
                return;
            }
            const u = db.users.find(x => x.id === userId);
            if (u) {
                u.role = newRole;
                saveDB();
                renderAll();
            }
        }

        function resetUserPassword(userId) {
            const u = db.users.find(x => x.id === userId);
            if (!u) return;
            const newPass = prompt(`Enter new password for ${u.name}:`, 'school123');
            if (newPass) {
                u.password = newPass.trim();
                saveDB();
                alert('Password reset successfully.');
            }
        }

        function deleteUser(userId) {
            const u = db.users.find(x => x.id === userId);
            if (u && u.email === 'harisawan.pk.@school.tm') {
                alert('Cannot delete Admin Haris Awan.');
                return;
            }
            if (confirm('Are you sure you want to delete this user?')) {
                db.users = db.users.filter(x => x.id !== userId);
                saveDB();
                renderAll();
            }
        }

        // --- 29. SETTINGS & DATA TAB ---
        function renderSettingsTab() {
            const isAdmin = currentUser.role === 'Admin';
            return `
            <div class="space-y-6 max-w-3xl mx-auto">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-gear text-blue-600 mr-2"></i> System Settings & Database Backup</h3>
                    <p class="text-xs text-slate-500">Export database JSON backups, restore states, or perform hard system resets.</p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-3">
                            <h4 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-download text-blue-600 mr-1"></i> Export Database Backup</h4>
                            <p class="text-xs text-slate-600">Download complete system database JSON file for local backup.</p>
                            <button onclick="exportDatabaseJSON()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow transition">Export JSON</button>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-3">
                            <h4 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-upload text-purple-600 mr-1"></i> Import Database Backup</h4>
                            <p class="text-xs text-slate-600">Restore system state from a previously exported JSON backup file.</p>
                            <input type="file" id="importFile" accept=".json" onchange="importDatabaseJSON(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                        </div>
                    </div>

                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-3">
                        <h4 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-cloud text-emerald-600 mr-1"></i> Cloud Firebase Sync</h4>
                        <p class="text-xs text-slate-600">Sync local database records with cloud cluster.</p>
                        <button onclick="alert('Firebase sync simulated successfully. All records synchronized.')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-xl text-xs shadow transition">Sync To Firebase</button>
                    </div>

                    ${isAdmin ? `
                        <div class="bg-rose-50 border border-rose-200 rounded-2xl p-5 space-y-3">
                            <h4 class="font-bold text-sm text-rose-800"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Danger Zone - Hard Reset</h4>
                            <p class="text-xs text-rose-700">Delete all records and restore factory default state. Admin Haris Awan account will remain intact.</p>
                            <button onclick="hardResetSystem()" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-6 py-2.5 rounded-xl text-xs shadow transition">Hard Reset Database</button>
                        </div>
                    ` : ''}

                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs text-slate-600 space-y-1">
                        <div><strong>Database Name:</strong> GPS_DHOK_JHATT_DB_V6</div>
                        <div><strong>Primary Administrator:</strong> Haris Awan (harisawan.pk.@school.tm)</div>
                        <div><strong>Head Teacher Role:</strong> Enabled</div>
                        <div><strong>School Location:</strong> Dhok Jhatt - Punjab, Pakistan</div>
                    </div>
                </div>
            </div>`;
        }

        function exportDatabaseJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "GPS_Dhok_Jhatt_Backup_2026.json");
            a.click();
        }

        function importDatabaseJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    db = parsed;
                    saveDB();
                    alert('Database restored successfully.');
                    renderAll();
                } catch(err) {
                    alert('Invalid JSON file.');
                }
            };
            reader.readAsText(file);
        }

        function hardResetSystem() {
            if (confirm('Are you sure you want to perform a Hard Reset? All custom data will be erased except Admin Haris Awan.')) {
                db = JSON.parse(JSON.stringify(defaultDB));
                saveDB();
                currentUser = db.users[0];
                localStorage.setItem('GPS_CURRENT_USER', JSON.stringify(currentUser));
                currentTab = 'overview';
                renderAll();
                alert('System successfully reset to factory default.');
            }
        }

        // --- GLOBAL MODAL CONTROLLER ---
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('globalModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('globalModal').classList.add('hidden');
            document.getElementById('modalContent').innerHTML = '';
        }

        // --- INITIALIZE APPLICATION ON LOAD ---
        window.onload = function() {
            loadDB();
            renderAll();
        };
    </script>
</body>
</html>
